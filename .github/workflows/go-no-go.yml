name: Go/No-Go Gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - test
          - staging
          - production
  # Also runs as a pre-deploy check before CD
  workflow_call:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        type: string
    outputs:
      decision:
        description: "GO or NO-GO"
        value: ${{ jobs.decision.outputs.verdict }}

concurrency:
  group: go-no-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: Quality ──────────────────────────────────────────
  quality:
    name: "Gate: Quality"
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.verdict.outputs.status }}
      details: ${{ steps.verdict.outputs.details }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @crm/shared build

      - name: Backend tests
        id: backend-tests
        run: pnpm --filter @crm/server test -- --ci --passWithNoTests 2>&1 | tee backend-test.txt
        continue-on-error: true

      - name: Frontend tests
        id: frontend-tests
        run: pnpm --filter @crm/web test 2>&1 | tee frontend-test.txt
        continue-on-error: true

      - name: Type check (server)
        id: typecheck-server
        run: pnpm --filter @crm/server build
        continue-on-error: true

      - name: Type check (web)
        id: typecheck-web
        run: pnpm --filter @crm/web type-check
        continue-on-error: true

      - name: Lint
        id: lint
        run: |
          pnpm --filter @crm/server lint
          pnpm --filter @crm/web lint
        continue-on-error: true

      - name: Web build
        id: web-build
        run: pnpm --filter @crm/web build
        continue-on-error: true

      - name: Evaluate quality gate
        id: verdict
        run: |
          FAILURES=""
          [[ "${{ steps.backend-tests.outcome }}" != "success" ]] && FAILURES="$FAILURES backend-tests"
          [[ "${{ steps.frontend-tests.outcome }}" != "success" ]] && FAILURES="$FAILURES frontend-tests"
          [[ "${{ steps.typecheck-server.outcome }}" != "success" ]] && FAILURES="$FAILURES server-typecheck"
          [[ "${{ steps.typecheck-web.outcome }}" != "success" ]] && FAILURES="$FAILURES web-typecheck"
          [[ "${{ steps.lint.outcome }}" != "success" ]] && FAILURES="$FAILURES lint"
          [[ "${{ steps.web-build.outcome }}" != "success" ]] && FAILURES="$FAILURES web-build"

          if [[ -z "$FAILURES" ]]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "details=All 6 checks passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "details=Failed:$FAILURES" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Quality Gate: ${{ steps.verdict.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend tests | ${{ steps.backend-tests.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend tests | ${{ steps.frontend-tests.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Type check (server) | ${{ steps.typecheck-server.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Type check (web) | ${{ steps.typecheck-web.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | ${{ steps.lint.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Web build | ${{ steps.web-build.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"

  # ── Gate 2: Security ─────────────────────────────────────────
  security:
    name: "Gate: Security"
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.verdict.outputs.status }}
      details: ${{ steps.verdict.outputs.details }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit (high)
        id: audit
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: License policy
        id: license
        run: pnpm dlx license-checker --failOn 'GPL-2.0;GPL-3.0;AGPL-3.0'
        continue-on-error: true

      - name: Snyk scan
        id: snyk
        if: ${{ secrets.SNYK_TOKEN != '' }}
        run: pnpm dlx snyk test --severity-threshold=high
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Docker non-root check
        id: nonroot
        run: |
          docker build -f docker/server/Dockerfile -t crm-server:gate-check . --quiet
          USER_INFO=$(docker run --rm crm-server:gate-check whoami)
          if [[ "$USER_INFO" == "root" ]]; then
            echo "Container runs as root!"
            exit 1
          fi
          echo "Container user: $USER_INFO"
        continue-on-error: true

      - name: Evaluate security gate
        id: verdict
        run: |
          ENV="${{ inputs.environment || 'staging' }}"
          FAILURES=""

          # Audit is blocking only for production
          if [[ "$ENV" == "production" && "${{ steps.audit.outcome }}" != "success" ]]; then
            FAILURES="$FAILURES dep-audit"
          fi

          [[ "${{ steps.license.outcome }}" != "success" ]] && FAILURES="$FAILURES license-policy"
          [[ "${{ steps.nonroot.outcome }}" != "success" ]] && FAILURES="$FAILURES container-root"

          if [[ -z "$FAILURES" ]]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "details=Deps, licenses, container security OK" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "details=Failed:$FAILURES" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Security Gate: ${{ steps.verdict.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency audit | ${{ steps.audit.outcome == 'success' && '✅' || '⚠️' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| License policy | ${{ steps.license.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container non-root | ${{ steps.nonroot.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"

  # ── Gate 3: Performance ──────────────────────────────────────
  performance:
    name: "Gate: Performance"
    runs-on: ubuntu-latest
    needs: [quality] # needs web build artifact
    outputs:
      status: ${{ steps.verdict.outputs.status }}
      details: ${{ steps.verdict.outputs.details }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build shared & web
        run: |
          pnpm --filter @crm/shared build
          pnpm --filter @crm/web build

      - name: Check bundle size
        id: bundle
        run: |
          DIST="packages/web/dist"
          if [[ -d "$DIST" ]]; then
            JS_BYTES=$(find "$DIST" -name '*.js' -exec stat --format='%s' {} + | awk '{s+=$1}END{print s+0}')
            JS_KB=$((JS_BYTES / 1024))
            echo "js_kb=$JS_KB" >> "$GITHUB_OUTPUT"

            # Threshold: 2MB total JS
            if [[ $JS_BYTES -lt 2097152 ]]; then
              echo "pass=true" >> "$GITHUB_OUTPUT"
            else
              echo "pass=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "pass=true" >> "$GITHUB_OUTPUT"
            echo "js_kb=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Docker image sizes
        id: image-size
        run: |
          docker build -f docker/server/Dockerfile -t crm-server:size-check . --quiet
          docker build -f docker/web/Dockerfile -t crm-web:size-check . --quiet

          SERVER_SIZE=$(docker image inspect crm-server:size-check --format='{{.Size}}')
          WEB_SIZE=$(docker image inspect crm-web:size-check --format='{{.Size}}')

          SERVER_MB=$((SERVER_SIZE / 1048576))
          WEB_MB=$((WEB_SIZE / 1048576))

          echo "server_mb=$SERVER_MB" >> "$GITHUB_OUTPUT"
          echo "web_mb=$WEB_MB" >> "$GITHUB_OUTPUT"

          # Thresholds: server < 500MB, web < 100MB
          PASS=true
          [[ $SERVER_SIZE -gt 524288000 ]] && PASS=false
          [[ $WEB_SIZE -gt 104857600 ]] && PASS=false
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Evaluate performance gate
        id: verdict
        run: |
          FAILURES=""
          [[ "${{ steps.bundle.outputs.pass }}" != "true" ]] && FAILURES="$FAILURES bundle-size(${{ steps.bundle.outputs.js_kb }}KB)"
          [[ "${{ steps.image-size.outputs.pass }}" == "false" ]] && FAILURES="$FAILURES image-size"

          if [[ -z "$FAILURES" ]]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "details=JS ${{ steps.bundle.outputs.js_kb }}KB, Server ${{ steps.image-size.outputs.server_mb }}MB, Web ${{ steps.image-size.outputs.web_mb }}MB" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "details=Failed:$FAILURES" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Performance Gate: ${{ steps.verdict.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value | Threshold | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| JS bundle | ${{ steps.bundle.outputs.js_kb }}KB | < 2048KB | ${{ steps.bundle.outputs.pass == 'true' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Server image | ${{ steps.image-size.outputs.server_mb }}MB | < 500MB | ${{ steps.image-size.outputs.pass != 'false' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Web image | ${{ steps.image-size.outputs.web_mb }}MB | < 100MB | ${{ steps.image-size.outputs.pass != 'false' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"

  # ── Gate 4: Operations ───────────────────────────────────────
  operations:
    name: "Gate: Operations"
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.verdict.outputs.status }}
      details: ${{ steps.verdict.outputs.details }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose validity
        id: compose
        run: docker compose config --quiet
        continue-on-error: true

      - name: Dockerfile lint (hadolint)
        id: hadolint
        run: |
          docker run --rm -i hadolint/hadolint < docker/server/Dockerfile || true
          docker run --rm -i hadolint/hadolint < docker/web/Dockerfile || true
          echo "done=true" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Check required scripts
        id: scripts
        run: |
          MISSING=""
          [[ ! -f scripts/deploy.sh ]] && MISSING="$MISSING deploy.sh"
          [[ ! -f scripts/db-backup.sh ]] && MISSING="$MISSING db-backup.sh"
          if [[ -z "$MISSING" ]]; then
            echo "pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "pass=false" >> "$GITHUB_OUTPUT"
            echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          fi

      - name: Check K8s manifests
        id: k8s
        run: |
          if [[ -d k8s ]]; then
            COUNT=$(find k8s -name '*.yaml' -o -name '*.yml' | wc -l)
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check health endpoint exists in code
        id: health
        run: |
          if grep -r "health" packages/server/src/modules/health/ > /dev/null 2>&1; then
            echo "pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "pass=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate operations gate
        id: verdict
        run: |
          FAILURES=""
          [[ "${{ steps.compose.outcome }}" != "success" ]] && FAILURES="$FAILURES docker-compose"
          [[ "${{ steps.scripts.outputs.pass }}" != "true" ]] && FAILURES="$FAILURES missing-scripts:${{ steps.scripts.outputs.missing }}"
          [[ "${{ steps.health.outputs.pass }}" != "true" ]] && FAILURES="$FAILURES no-health-endpoint"

          if [[ -z "$FAILURES" ]]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "details=Compose valid, scripts present, health endpoint OK, K8s: ${{ steps.k8s.outputs.count }} manifests" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "details=Failed:$FAILURES" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Operations Gate: ${{ steps.verdict.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Compose | ${{ steps.compose.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy scripts | ${{ steps.scripts.outputs.pass == 'true' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Health endpoint | ${{ steps.health.outputs.pass == 'true' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| K8s manifests | ${{ steps.k8s.outputs.present == 'true' && '✅' || '⏭️' }} (${{ steps.k8s.outputs.count }}) |" >> "$GITHUB_STEP_SUMMARY"

  # ── Final Decision ───────────────────────────────────────────
  decision:
    name: "Decision: Go / No-Go"
    runs-on: ubuntu-latest
    needs: [quality, security, performance, operations]
    if: always()
    outputs:
      verdict: ${{ steps.decide.outputs.verdict }}
    steps:
      - name: Compute verdict
        id: decide
        run: |
          Q="${{ needs.quality.outputs.status }}"
          S="${{ needs.security.outputs.status }}"
          P="${{ needs.performance.outputs.status }}"
          O="${{ needs.operations.outputs.status }}"

          echo "Quality:     $Q"
          echo "Security:    $S"
          echo "Performance: $P"
          echo "Operations:  $O"

          if [[ "$Q" == "PASS" && "$S" == "PASS" && "$P" == "PASS" && "$O" == "PASS" ]]; then
            echo "verdict=GO" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=NO-GO" >> "$GITHUB_OUTPUT"
          fi

      - name: Decision report
        if: always()
        run: |
          VERDICT="${{ steps.decide.outputs.verdict }}"
          ENV="${{ inputs.environment || 'staging' }}"

          echo "# Go / No-Go Decision Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment:** $ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status | Details |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Quality | ${{ needs.quality.outputs.status == 'PASS' && '✅ PASS' || '❌ FAIL' }} | ${{ needs.quality.outputs.details }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security | ${{ needs.security.outputs.status == 'PASS' && '✅ PASS' || '❌ FAIL' }} | ${{ needs.security.outputs.details }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Performance | ${{ needs.performance.outputs.status == 'PASS' && '✅ PASS' || '❌ FAIL' }} | ${{ needs.performance.outputs.details }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Operations | ${{ needs.operations.outputs.status == 'PASS' && '✅ PASS' || '❌ FAIL' }} | ${{ needs.operations.outputs.details }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$VERDICT" == "GO" ]]; then
            echo "## ✅ Decision: **GO**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All gates passed. Safe to deploy to **$ENV**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Decision: **NO-GO**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more gates failed. Resolve issues before deploying to **$ENV**." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail pipeline on NO-GO
        if: steps.decide.outputs.verdict == 'NO-GO'
        run: |
          echo "::error::GO/NO-GO verdict: NO-GO — deployment blocked"
          exit 1
