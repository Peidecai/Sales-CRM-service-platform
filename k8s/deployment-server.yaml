apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-server
  namespace: crm-sales
  labels:
    app.kubernetes.io/name: crm-server
    app.kubernetes.io/part-of: crm-sales-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: crm-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crm-server
        app.kubernetes.io/part-of: crm-sales-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: server
          image: crm-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: crm-server-config
            - secretRef:
                name: crm-server-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: server-data
              mountPath: /app/packages/server/data
            - name: server-logs
              mountPath: /app/packages/server/logs
      volumes:
        - name: server-data
          persistentVolumeClaim:
            claimName: crm-server-data
        - name: server-logs
          emptyDir: {}
