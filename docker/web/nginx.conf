# ==============================================================
# CRM Sales Platform — Main Nginx Configuration
# Full nginx.conf (replaces the default at /etc/nginx/nginx.conf)
# ==============================================================

# Run as nginx user (non-root in Docker)
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format — structured for log aggregation
    log_format main_json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log main_json;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    # Hide server version
    server_tokens off;

    # ── Rate Limiting Zones ──────────────────────────────────
    # Connection limit: max 50 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Request rate limit: 30 requests/second per IP (burst handled per-location)
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=30r/s;

    # API rate limit: stricter 10 requests/second for API endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Login rate limit: very strict 5 requests/minute
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # ── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff2;

    # ── Brotli Compression (requires ngx_brotli module) ──────
    # Uncomment if nginx is built with the brotli module:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/xml
    #     text/javascript
    #     application/json
    #     application/javascript
    #     application/xml
    #     application/xml+rss
    #     application/wasm
    #     image/svg+xml
    #     font/woff2;

    # Serve pre-compressed .gz and .br files if they exist
    gzip_static on;
    # brotli_static on;  # Uncomment with brotli module

    # ── Upstream Backend ─────────────────────────────────────
    upstream backend {
        server crm-server:3000;
        keepalive 32;
    }

    # ── Server Block ─────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # ── Security Headers ─────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Global Rate & Connection Limits ──────────────────
        limit_conn conn_limit 50;
        limit_req zone=req_limit burst=50 nodelay;

        # ── Hashed Static Assets — immutable 1-year cache ────
        location ~* \.(?:js|css)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── Images / Fonts — 7-day cache ─────────────────────
        location ~* \.(?:png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # ── HTML — no-cache (SPA entry point) ────────────────
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }

        # ── Cloud Call Webhook Callback — no rate limit ─────────
        # Webhook from cloud call provider (signature-verified by backend)
        location /api/v1/cloud-call/callback {
            # No rate limiting for provider callbacks
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # ── API Login Endpoint — strict rate limit ───────────
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── API Proxy — moderate rate limit ──────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 4 16k;
        }

        # ── WebSocket (Socket.IO) Proxy ──────────────────────
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Block dotfiles (.env, .git, etc.) ────────────────
        location ~ /\. {
            deny all;
            return 404;
        }

        # ── Custom error pages ───────────────────────────────
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
