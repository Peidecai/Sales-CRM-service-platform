services:
  mysql:
    image: mysql:8.0
    container_name: crm-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-please-change-root-in-production}
      MYSQL_DATABASE: crm_sales
      MYSQL_USER: ${DB_USERNAME:-crm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-please-change-in-production}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "--password=${DB_ROOT_PASSWORD:-please-change-root-in-production}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - crm-network

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

  minio:
    image: minio/minio:latest
    container_name: crm-minio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OSS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OSS_ACCESS_KEY_SECRET:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - crm-network

  minio-init:
    image: minio/mc:latest
    container_name: crm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${BUCKET};
      mc anonymous set download local/$${BUCKET};
      echo 'Bucket ready';
      "
    environment:
      MINIO_ROOT_USER: ${OSS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OSS_ACCESS_KEY_SECRET:-minioadmin123}
      BUCKET: ${OSS_BUCKET:-crm-call-recordings}
    networks:
      - crm-network

  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    container_name: crm-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-crm_user}
      DB_PASSWORD: ${DB_PASSWORD:-please-change-in-production}
      DB_DATABASE: crm_sales
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-20}
      # Explicitly unset root password — app container must not have it
      DB_ROOT_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-in-production}
      JWT_ACCESS_EXPIRES_IN: 2h
      JWT_REFRESH_EXPIRES_IN: 7d
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      WX_MINIAPP_APPID: ${WX_MINIAPP_APPID:-}
      WX_MINIAPP_SECRET: ${WX_MINIAPP_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # Cloud Call (阿里云 CCC)
      CLOUD_CALL_PROVIDER: ${CLOUD_CALL_PROVIDER:-aliyun}
      CLOUD_CALL_INSTANCE_ID: ${CLOUD_CALL_INSTANCE_ID:-}
      CLOUD_CALL_ACCESS_KEY_ID: ${CLOUD_CALL_ACCESS_KEY_ID:-}
      CLOUD_CALL_ACCESS_KEY_SECRET: ${CLOUD_CALL_ACCESS_KEY_SECRET:-}
      CLOUD_CALL_CALLBACK_URL: ${CLOUD_CALL_CALLBACK_URL:-http://localhost:3000/api/v1/cloud-call/callback}
      CLOUD_CALL_WEBHOOK_SECRET: ${CLOUD_CALL_WEBHOOK_SECRET:-}
      CLOUD_CALL_PHONE_NUMBERS: ${CLOUD_CALL_PHONE_NUMBERS:-}
      CLOUD_CALL_CONCURRENT_LINES: ${CLOUD_CALL_CONCURRENT_LINES:-10}
      # OSS / S3-compatible storage (recordings, materials)
      OSS_ENDPOINT: ${OSS_ENDPOINT:-http://minio:9000}
      OSS_REGION: ${OSS_REGION:-us-east-1}
      OSS_BUCKET: ${OSS_BUCKET:-crm-call-recordings}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-minioadmin}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-minioadmin123}
      OSS_FORCE_PATH_STYLE: ${OSS_FORCE_PATH_STYLE:-true}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - server_data:/app/packages/server/data
      - server_logs:/app/packages/server/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - crm-network

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: crm-web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  server_data:
    driver: local
  server_logs:
    driver: local
